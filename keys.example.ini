# Copy this file to keys.ini (git ignores that name) and fill in only the providers you have.
# A key left empty here is read from the environment instead (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY,
# OPENROUTER_API_KEY, GROQ_API_KEY, TOGETHER_API_KEY, MISTRAL_API_KEY, XAI_API_KEY, DEEPSEEK_API_KEY).
#
# Use a remote model by prefixing its name with the provider:
#   python adt.py run asi01 --models anthropic:claude-haiku-5-5,openai:gpt-4.1-mini,llama3.1:8b
# A name with no provider prefix is a local Ollama model, as before. Check what is set up with:  python adt.py keys

[anthropic]
api_key =

[openai]
api_key =

[google]
api_key =

[openrouter]
api_key =

# Any other OpenAI-compatible service: name the section anything, give it a base_url.
# [myhost]
# api_key =
# base_url = https://example.test/v1

# Spending guards. Remote calls cost money, and a run is hundreds to thousands of calls.
[limits]
# Longest reply asked for, per call.
max_output_tokens = 2048
# Stop the run after this many remote calls in one process. 0 means no cap.
max_calls = 0
